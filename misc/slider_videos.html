<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      padding: 20px;
    }

    /* CSS Slider */
    .css-slider {
      display: flex;
      overflow: hidden;
      width: 100%;
      max-width: 600px;
      margin: auto;
      position: relative;
    }
    .css-slider img {
      width: 100%;
      animation: slide 12s infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(0%); }
      33%  { transform: translateX(-100%); }
      66%  { transform: translateX(-200%); }
      100% { transform: translateX(0%); }
    }

    /* JavaScript Slider */
    .js-slider {
      width: 600px;
      margin: auto;
      position: relative;
    }
    .js-slider img {
      width: 100%;
      height: auto;
    }
    .js-slider button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
    .prev { left: 0; }
    .next { right: 0; }
  </style>
</head>
<body>

  <h2>1. Bootstrap Carousel</h2>
  <div id="bootstrapCarousel" class="carousel slide" data-bs-ride="carousel" style="max-width:600px; margin:auto;">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://via.placeholder.com/600x300/ff7f7f/333333?text=Slide+1" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="https://via.placeholder.com/600x300/87ceeb/333333?text=Slide+2" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="https://via.placeholder.com/600x300/90ee90/333333?text=Slide+3" class="d-block w-100">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#bootstrapCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#bootstrapCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <hr>

  <h2>2. CSS-Only Slider</h2>
  <div class="css-slider">
    <img src="https://via.placeholder.com/600x300/ff7f7f/fff?text=1">
    <img src="https://via.placeholder.com/600x300/87ceeb/fff?text=2">
    <img src="https://via.placeholder.com/600x300/90ee90/fff?text=3">
  </div>

  <hr>

  <h2>3. JavaScript Image Slider</h2>
  <div class="js-slider">
    <img id="jsSlide" src="https://via.placeholder.com/600x300/ff7f7f/fff?text=1" alt="JS Slider">
    <button class="prev" onclick="changeSlide(-1)">❮</button>
    <button class="next" onclick="changeSlide(1)">❯</button>
  </div>

  <hr>

  <h2>4. HTML5 Video</h2>
  <video controls width="600">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <hr>

  <h2>5. YouTube Embedded Video</h2>
  <div style="max-width: 600px; margin:auto;">
    <iframe width="100%" height="315" src="https://www.youtube.com/embed/tgbNymZ7vqY"
      title="YouTube video player" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </div>

  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // JavaScript Image Slider Logic
    const jsImages = [
      "https://via.placeholder.com/600x300/ff7f7f/fff?text=1",
      "https://via.placeholder.com/600x300/87ceeb/fff?text=2",
      "https://via.placeholder.com/600x300/90ee90/fff?text=3"
    ];
    let jsIndex = 0;

    function changeSlide(direction) {
      jsIndex += direction;
      if (jsIndex < 0) jsIndex = jsImages.length - 1;
      if (jsIndex >= jsImages.length) jsIndex = 0;
      document.getElementById("jsSlide").src = jsImages[jsIndex];
    }
  </script>

</body>
</html>
